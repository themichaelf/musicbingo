<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120b1c">
<title>Music Bingo Spinner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;600;700&display=swap">
<style>
/* Layout: one column, title, the wheel as large as the screen allows, result underneath. Same look as the bingo card. */
:root {
  color-scheme: dark;
  --stage: #120b1c;
  --stage-glow-a: #ff2d95;
  --stage-glow-b: #1fd1e8;
  --card: #221a2e;
  --card-edge: #3a2d4d;
  --ink: #f6f0ff;
  --ink-soft: #b9abcf;
  --accent: #ff4fa8;
  --mark: #120b1c;
  --display: "Bungee", "Arial Black", Impact, sans-serif;
  --body: "Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background:
    radial-gradient(60% 50% at 10% 0%, color-mix(in srgb, var(--stage-glow-a) 35%, transparent), transparent 70%),
    radial-gradient(60% 50% at 90% 100%, color-mix(in srgb, var(--stage-glow-b) 30%, transparent), transparent 70%),
    var(--stage);
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--body);
  padding-block: max(20px, env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-bottom, 0px));
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
}
h1 {
  margin: 0;
  font-family: var(--display);
  font-weight: 400;
  font-size: clamp(26px, 7vw, 38px);
  letter-spacing: .04em;
  color: var(--accent);
  text-shadow: 0 0 18px color-mix(in srgb, var(--accent) 55%, transparent);
  line-height: 1;
  text-align: center;
}

/* The wheel fills the narrower of the screen width or most of its height. */
.stage {
  position: relative;
  width: min(94vw, 64vh, 560px);
  max-width: 100%;
  aspect-ratio: 1;
  margin-top: 14px;
}
.wheel-btn {
  all: unset;
  display: block;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.wheel-btn:focus-visible { outline: 4px solid var(--ink); outline-offset: 6px; }
.wheel-btn[aria-disabled="true"] { cursor: default; }
#wheel {
  width: 100%;
  height: 100%;
  display: block;
  transform: rotate(0deg);
  filter: drop-shadow(0 14px 30px rgb(0 0 0 / .55));
}
#wheel.spinning { transition: transform 4.6s cubic-bezier(.12, .62, .1, 1); }
.seg-label {
  font-family: var(--display);
  font-size: 11px;
  letter-spacing: .06em;
  fill: var(--mark);
  opacity: .78;
}

/* Arrow at the top, pointing down into the wheel. */
.pointer {
  position: absolute;
  left: 50%;
  top: -18px;
  width: 15%;
  aspect-ratio: 3 / 4;
  transform: translateX(-50%);
  pointer-events: none;
  filter: drop-shadow(0 4px 6px rgb(0 0 0 / .6));
  z-index: 2;
}
.pointer.tick { animation: tick .14s ease-out; }
@keyframes tick { 50% { transform: translateX(-50%) rotate(-12deg); } }

.result {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  min-height: 64px;
  padding: 10px 22px;
  border-radius: 999px;
  background: var(--card);
  border: 2px solid var(--card-edge);
  font-weight: 700;
  font-size: clamp(18px, 5vw, 24px);
  letter-spacing: .04em;
  text-transform: uppercase;
  transition: border-color .2s ease, box-shadow .2s ease;
}
.result .chip {
  width: 36px; height: 36px;
  border-radius: 8px;
  border: 2px solid rgb(0 0 0 / .55);
  box-shadow: inset 0 -3px 0 rgb(0 0 0 / .18), inset 0 2px 0 rgb(255 255 255 / .35);
}
.result .chip[hidden] { display: none; }
.result.show { animation: pop .35s ease; }
@keyframes pop { 0% { transform: scale(.85); } 60% { transform: scale(1.06); } 100% { transform: none; } }
.hint { margin: -6px 0 0; font-size: 14px; color: var(--ink-soft); text-align: center; }

@media (prefers-reduced-motion: reduce) {
  #wheel.spinning { transition-duration: 1.2s; }
  .pointer.tick, .result.show { animation: none; }
}
</style>

<h1>MUSIC BINGO</h1>

<div class="stage">
  <svg class="pointer" viewBox="0 0 30 40" aria-hidden="true">
    <path d="M3 3 H27 Q29 3 28 5 L16.5 37 Q15 40 13.5 37 L2 5 Q1 3 3 3 Z" fill="#f6f0ff" stroke="#120b1c" stroke-width="2.5" stroke-linejoin="round"/>
  </svg>
  <button class="wheel-btn" id="spinBtn" type="button" aria-label="Spin the wheel">
    <svg id="wheel" viewBox="-110 -110 220 220" aria-hidden="true"></svg>
  </button>
</div>

<div class="result" id="result" aria-live="polite">
  <span class="chip" id="chip" hidden></span>
  <span id="resultText">Tap the wheel to spin</span>
</div>
<p class="hint" id="hint"></p>

<script>
(() => {
  // Same five colors as the bingo card (light and dark end of each gradient).
  const COLORS = [
    { name: "Yellow", a: "#fff176", b: "#f5c400" },
    { name: "Blue",   a: "#6cc4ff", b: "#1e7fe0" },
    { name: "Purple", a: "#c98cff", b: "#8a2bd6" },
    { name: "Green",  a: "#8be28f", b: "#2fa84f" },
    { name: "Pink",   a: "#ff9cc4", b: "#e8357a" },
  ];
  const SEG = 360 / COLORS.length;
  const R = 100;
  const NS = "http://www.w3.org/2000/svg";
  const wheel = document.getElementById("wheel");
  const btn = document.getElementById("spinBtn");
  const pointer = document.querySelector(".pointer");
  const result = document.getElementById("result");
  const resultText = document.getElementById("resultText");
  const chip = document.getElementById("chip");
  const hint = document.getElementById("hint");

  const el = (tag, attrs) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); return n; };
  const pt = (deg, r) => { const t = deg * Math.PI / 180; return [Math.sin(t) * r, -Math.cos(t) * r]; }; // 0° = top, clockwise

  // Build the wheel.
  const defs = el("defs", {});
  wheel.appendChild(defs);
  wheel.appendChild(el("circle", { r: R + 6, fill: "#221a2e", stroke: "#3a2d4d", "stroke-width": 3 }));
  COLORS.forEach((c, i) => {
    const g = el("radialGradient", { id: "g" + i, cx: 0, cy: 0, r: R, gradientUnits: "userSpaceOnUse" });
    g.appendChild(el("stop", { offset: "0%", "stop-color": c.a }));
    g.appendChild(el("stop", { offset: "100%", "stop-color": c.b }));
    defs.appendChild(g);
    const a0 = i * SEG, a1 = a0 + SEG;
    const [x0, y0] = pt(a0, R), [x1, y1] = pt(a1, R);
    wheel.appendChild(el("path", {
      d: `M0 0 L${x0} ${y0} A${R} ${R} 0 0 1 ${x1} ${y1} Z`,
      fill: `url(#g${i})`, stroke: "#120b1c", "stroke-width": 2, "stroke-linejoin": "round",
    }));
    const mid = a0 + SEG / 2, [lx, ly] = pt(mid, R * 0.66);
    const label = el("text", { x: lx, y: ly, class: "seg-label", "text-anchor": "middle", "dominant-baseline": "middle", transform: `rotate(${mid} ${lx} ${ly})` });
    label.textContent = c.name.toUpperCase();
    wheel.appendChild(label);
  });
  // Pegs around the rim and a hub in the middle.
  for (let i = 0; i < COLORS.length * 3; i++) {
    const [x, y] = pt(i * SEG / 3, R + 1);
    wheel.appendChild(el("circle", { cx: x, cy: y, r: 2.6, fill: "#f6f0ff", stroke: "#120b1c", "stroke-width": 1 }));
  }
  wheel.appendChild(el("circle", { r: 17, fill: "#221a2e", stroke: "#120b1c", "stroke-width": 3 }));
  const hub = el("text", { y: 1, "text-anchor": "middle", "dominant-baseline": "middle", fill: "#ff4fa8", style: "font: 400 8px var(--display); letter-spacing: .05em" });
  hub.textContent = "SPIN";
  wheel.appendChild(hub);

  let rotation = 0, spinning = false, tickRaf = 0;

  // Wiggle the arrow each time a segment edge passes under it.
  function watchTicks() {
    let lastSeg = null;
    const loop = () => {
      const m = getComputedStyle(wheel).transform;
      if (m && m !== "none") {
        const [a, b] = m.slice(7, -1).split(",").map(Number);
        const deg = (Math.atan2(b, a) * 180 / Math.PI + 360) % 360;
        const seg = Math.floor(((360 - deg) % 360) / (SEG / 3));
        if (lastSeg !== null && seg !== lastSeg) {
          pointer.classList.remove("tick"); void pointer.offsetWidth; pointer.classList.add("tick");
        }
        lastSeg = seg;
      }
      if (spinning) tickRaf = requestAnimationFrame(loop);
    };
    tickRaf = requestAnimationFrame(loop);
  }

  function spin() {
    if (spinning) return;
    spinning = true;
    btn.setAttribute("aria-disabled", "true");
    result.classList.remove("show");
    chip.hidden = true;
    resultText.textContent = "Spinning…";
    hint.textContent = "";

    const pick = Math.floor(Math.random() * COLORS.length);
    // Land somewhere inside the chosen slice, away from its edges.
    const landAt = pick * SEG + SEG / 2 + (Math.random() - 0.5) * SEG * 0.75;
    const current = ((rotation % 360) + 360) % 360;
    const target = (360 - landAt + 360) % 360;
    const turns = 5 + Math.floor(Math.random() * 3);
    rotation += turns * 360 + ((target - current + 360) % 360);

    wheel.classList.add("spinning");
    wheel.style.transform = `rotate(${rotation}deg)`;
    watchTicks();

    const done = () => {
      wheel.removeEventListener("transitionend", done);
      clearTimeout(fallback);
      spinning = false;
      cancelAnimationFrame(tickRaf);
      wheel.classList.remove("spinning");
      btn.removeAttribute("aria-disabled");
      const c = COLORS[pick];
      chip.style.background = `linear-gradient(135deg, ${c.a}, ${c.b})`;
      chip.hidden = false;
      resultText.textContent = c.name;
      result.style.borderColor = c.b;
      result.style.boxShadow = `0 0 22px ${c.b}88`;
      result.classList.add("show");
      hint.textContent = "Tap the wheel to spin again";
    };
    wheel.addEventListener("transitionend", done);
    const fallback = setTimeout(done, 5200);
  }

  btn.addEventListener("click", spin);
})();
</script>
